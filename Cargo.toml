[package]
name = "kalo"
version = "0.1.0"
edition = "2024"
description = "Cross-platform Bluetooth file transfer over OBEX Object Push"
license = "MIT"
repository = "https://github.com/Ogalesha/Kalo"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
futures-util = "0.3"
iced = { version = "0.14", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zbus = "5"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
obex-protocol = "0.1"
windows = { version = "0.62", features = [
    "Foundation",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Devices_Radios",
    "Networking",
    "Networking_Sockets",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
