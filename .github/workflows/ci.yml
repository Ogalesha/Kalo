name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Build Ubuntu package
        run: ./packaging/ubuntu/build-deb.sh

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows (experimental)
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Build portable ZIP
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build-zip.ps1

      - name: Smoke-test the executable
        shell: powershell
        run: |
          .\target\release\kalo.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\target\release\kalo.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: target/release/kalo.exe
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --message-format=json -- -D warnings 2>&1 | tee clippy.jsonl

      - name: Report Clippy diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ ! -f clippy.jsonl ]]; then
            echo "no Clippy diagnostics were captured"
            exit 0
          fi
          python3 - <<'PY'
          import json

          def escape(value):
              return (
                  str(value)
                  .replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

          with open("clippy.jsonl", encoding="utf-8", errors="replace") as log:
              for raw in log:
                  try:
                      record = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if record.get("reason") != "compiler-message":
                      continue
                  message = record.get("message", {})
                  level = message.get("level", "error")
                  if level not in ("error", "warning"):
                      continue
                  text = escape(message.get("message", "Clippy diagnostic"))
                  spans = message.get("spans") or []
                  primary = next(
                      (span for span in spans if span.get("is_primary")), None
                  )
                  if primary:
                      print(
                          "::{} file={},line={},col={}::{}".format(
                              level,
                              escape(primary.get("file_name", "")),
                              primary.get("line_start", 1),
                              primary.get("column_start", 1),
                              text,
                          )
                      )
                  else:
                      print("::{}::{}".format(level, text))
          PY

      - name: Run tests
        run: cargo test --all-targets

      - name: Build the application bundle
        run: ./packaging/macos/build-app.sh

      - name: Smoke-test the app
        run: |
          ./dist/Kalo.app/Contents/MacOS/kalo --version
          ./dist/Kalo.app/Contents/MacOS/kalo --help

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/kalo-macos-universal.zip
          if-no-files-found: error

  arch:
    name: Arch Linux
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git namcap rust cargo sudo

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare the build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          cp -a "$GITHUB_WORKSPACE" /home/builder/kalo
          chown -R builder:builder /home/builder/kalo
          su builder -c "cd /home/builder/kalo && git checkout -b ci-source"

      - name: Build the package
        run: |
          mkdir -p /home/builder/pkg
          cp /home/builder/kalo/packaging/arch/PKGBUILD /home/builder/pkg/
          sed -i 's|^source=.*|source=("kalo-git::git+file:///home/builder/kalo#branch=ci-source")|' /home/builder/pkg/PKGBUILD
          chown -R builder:builder /home/builder/pkg
          su builder -c "cd /home/builder/pkg && makepkg -s --noconfirm"
          echo "--- namcap ---"
          namcap /home/builder/pkg/*.pkg.tar.zst || true

      - name: Install and smoke-test the package
        run: |
          pacman -U --noconfirm /home/builder/pkg/*.pkg.tar.zst
          kalo --version
          kalo --help

      - name: Collect the package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp /home/builder/pkg/kalo-git-[0-9]*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: ${{ github.workspace }}/dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish latest builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, windows, macos, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "{linux-deb,windows-zip,windows-exe,macos-app,arch-package}"
          merge-multiple: true
          path: artifacts

      - name: Prepare stable asset names
        run: |
          mkdir -p release
          cp artifacts/*.deb release/kalo_amd64.deb
          cp artifacts/*.zip release/kalo-windows-x64.zip
          cp artifacts/kalo.exe release/kalo-windows-x64.exe
          cp artifacts/kalo-macos-universal.zip release/kalo-macos-universal.zip
          cp artifacts/kalo-git-[0-9]*.pkg.tar.zst release/kalo-git-x86_64.pkg.tar.zst
          cd release
          sha256sum kalo_amd64.deb kalo-windows-x64.zip kalo-windows-x64.exe kalo-macos-universal.zip kalo-git-x86_64.pkg.tar.zst > SHA256SUMS.txt
          ls -lh

      - name: Publish the rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Rolling builds from the newest successful `main` build.

            - Ubuntu: `kalo_amd64.deb`
            - Arch Linux: `kalo-git-x86_64.pkg.tar.zst`
            - macOS 11+ (universal, ad-hoc signed): `kalo-macos-universal.zip`
            - Windows (experimental, untested on hardware): `kalo-windows-x64.zip`, `kalo-windows-x64.exe`

            Built from commit `${{ github.sha }}` by GitHub Actions. macOS and Windows
            builds are not signed with a Developer ID or Authenticode certificate. See
            `SHA256SUMS.txt` for checksums.
          files: release/*
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
